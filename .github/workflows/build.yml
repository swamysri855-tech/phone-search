name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PhoneSearch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneSearch-apk
          path: PhoneSearch.apk

      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhoneSearch.apk \
            --target "${{ github.sha }}" \
            --title "Phone Search – తాజా APK" \
            --notes "ఫోన్‌లో PhoneSearch.apk ని download చేసి install చేయండి. (Branch: ${{ github.ref_name }})"
